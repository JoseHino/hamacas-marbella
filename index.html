<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parcelas de Hamacas Marbella</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#0e1621; --panel:#16212e; --panel2:#1d2a39; --line:#2a3a4d;
    --tx:#e8eef5; --tx2:#93a5b8; --acc:#37a0b4; --hot:#f44c3a; --ok:#99cc00;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--tx);overflow:hidden}
  #app{display:flex;height:100%}
  #side{width:370px;flex:0 0 370px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0}
  #map{flex:1;min-width:0;background:#0b1118}
  header{padding:14px 16px;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:15px;letter-spacing:.2px}
  header p{margin:4px 0 0;font-size:11.5px;color:var(--tx2);line-height:1.45}
  .ctl{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  input[type=search],select{width:100%;padding:7px 9px;border-radius:6px;border:1px solid var(--line);
    background:var(--panel2);color:var(--tx);font-size:12.5px;font-family:inherit}
  input[type=search]:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
  .row{display:flex;gap:8px}
  .row>*{flex:1;min-width:0}
  label.chk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--tx2);cursor:pointer}
  #cuenta{padding:8px 16px;font-size:11.5px;color:var(--tx2);border-bottom:1px solid var(--line)}
  #cuenta b{color:var(--tx)}
  #lista{overflow-y:auto;flex:1;min-height:0}
  .it{padding:9px 16px;border-bottom:1px solid #1e2b3a;cursor:pointer;display:flex;
    justify-content:space-between;align-items:center;gap:10px}
  .it:hover{background:var(--panel2)}
  .it.sel{background:#22384a;box-shadow:inset 3px 0 0 var(--acc)}
  .it .cod{font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums}
  .it .sub{font-size:11px;color:var(--tx2);margin-top:2px}
  .tag{font-size:10px;padding:2px 6px;border-radius:10px;white-space:nowrap;
    background:#2a3a4d;color:var(--tx2)}
  .tag.l100{background:rgba(244,76,58,.16);color:#ff9d90}
  footer{padding:9px 16px;border-top:1px solid var(--line);font-size:10.5px;color:var(--tx2);line-height:1.5}
  .lp{font-size:12.5px;line-height:1.5}
  .lp h3{margin:0 0 7px;font-size:14px;color:#0d2430}
  .lp table{border-collapse:collapse;width:100%}
  .lp td{padding:3px 0;vertical-align:top}
  .lp td:first-child{color:#5b7183;padding-right:12px;white-space:nowrap}
  .lp .hl{background:#fff4f2;border-left:3px solid var(--hot);padding:6px 8px;margin:8px 0 0;border-radius:3px}
  .leaflet-popup-content{margin:12px 14px;min-width:255px}
  .leaflet-container{background:#0b1118}
  .leyenda{background:rgba(22,33,46,.94);padding:9px 11px;border-radius:7px;border:1px solid var(--line);
    font-size:11.5px;line-height:1.9;color:var(--tx)}
  .leyenda i{width:13px;height:13px;display:inline-block;margin-right:7px;vertical-align:-2px;
    border-radius:2px;border:1.5px solid}
  #tira{display:none}
  /* --- telefono: mapa a pantalla completa con panel inferior desplegable --- */
  body.movil #app{display:block;position:relative}
  body.movil #map{position:absolute;inset:0;width:100%;height:100%}
  body.movil #side{position:absolute;left:0;right:0;bottom:0;top:auto;width:auto;
    max-height:72%;border-right:0;border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.45);
    z-index:1000;transition:transform .22s ease}
  body.movil #side.plegado{transform:translateY(calc(100% - 128px))}
  body.movil header{display:none}
  body.movil #tira{display:flex;align-items:center;gap:10px;padding:10px 16px 2px;cursor:pointer}
  body.movil #tira .asa{width:38px;height:4px;border-radius:2px;background:#3a4c61;margin:0 auto}
  body.movil #tira b{font-size:13px}
  body.movil .ctl{padding:10px 16px}
  body.movil input[type=search],body.movil select{padding:11px 10px;font-size:15px}
  body.movil label.chk{font-size:13.5px;padding:4px 0}
  body.movil label.chk input{width:18px;height:18px}
  body.movil .it{padding:13px 16px}
  body.movil .it .cod{font-size:14px}
  body.movil .it .sub{font-size:12px}
  body.movil footer{display:none}
  body.movil .leyenda{display:none}
  body.movil .leaflet-popup-content{min-width:0;width:auto !important;margin:11px 12px;font-size:13px}
  body.movil .leaflet-popup{max-width:86vw}
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <header>
      <h1>Parcelas de hamacas · T.M. de Marbella</h1>
      <p>135 parcelas extraídas de los planos oficiales georreferenciados del expediente. Pulsa una para situarla.</p>
    </header>
    <div id="tira"><div style="flex:1"><div class="asa"></div>
      <b id="tiraTx" style="display:block;margin-top:7px">135 parcelas</b></div>
      <span id="tiraIc" style="font-size:17px;color:var(--tx2)">▲</span></div>
    <div class="ctl">
      <input type="search" id="q" placeholder="Buscar código, playa o expediente…" autocomplete="off">
      <div class="row">
        <select id="fplaya"><option value="">Todas las playas</option></select>
        <select id="fexp"><option value="">Todos los expedientes</option></select>
      </div>
      <label class="chk"><input type="checkbox" id="f100"> Solo los 16 lotes de ≤100 m² (PAT 255/25)</label>
    </div>
    <div id="cuenta"></div>
    <div id="lista"></div>
    <footer id="pie"></footer>
  </div>
  <div id="map"></div>
</div>

const map = L.map('map', {zoomControl:true, preferCanvas:false});
const pnoa = L.tileLayer.wms('https://www.ign.es/wms-inspire/pnoa-ma', {
  layers:'OI.OrthoimageCoverage', format:'image/jpeg', transparent:false,
  attribution:'Ortofoto PNOA © Instituto Geográfico Nacional', maxZoom:21});
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19, attribution:'© OpenStreetMap'});
pnoa.addTo(map);
L.control.layers({'Ortofoto PNOA (IGN)':pnoa,'Callejero OSM':osm}, null, {position:'topright'}).addTo(map);
L.control.scale({imperial:false}).addTo(map);

function estilo(f){
  const l = f.properties.licita_100;
  return {color: l ? '#f44c3a' : '#37a0b4', weight: l ? 2.4 : 1.6,
          fillColor: l ? '#f44c3a' : '#37a0b4', fillOpacity: l ? .55 : .35};
}
const capa = L.geoJSON(DATOS, {style:estilo, onEachFeature:(f,l)=>{
  l.bindPopup(ficha(f.properties), {maxWidth:330});
  l.on('click', ()=>marca(f.properties.codigo));
}}).addTo(map);

function fila(k,v){ return v==null||v===''?'':`<tr><td>${k}</td><td>${v}</td></tr>`; }
function ficha(p){
  let h = `<div class="lp"><h3>${p.codigo}</h3><table>`;
  h += fila('Playa', p.playa);
  h += fila('Superficie autorizada', p.superficie+' m²');
  h += fila('Medida en el plano', p.sup_medida+' m² <span style="color:#8aa">('+(p.desv>0?'+':'')+p.desv+'%)</span>');
  h += fila('Expediente', '<b>'+p.expediente+'</b>');
  h += fila('Objeto', p.exp_objeto);
  h += fila('Estado', p.exp_estado);
  h += fila('Valor del expediente', p.exp_importe);
  h += fila('Publicación', p.exp_pub);
  h += fila('Origen', p.plano);
  h += '</table>';
  if(p.lote){
    h += `<div class="hl"><b>Lote ${p.lote}</b> de la licitación de ≤100 m²<table>`;
    h += fila('Canon anual mínimo', p.canon);
    h += fila('Precio hamaca + sombrilla', p.precio_hamaca);
    h += fila('Precio por elemento', p.precio_elemento);
    h += fila('Tramo de Costas', p.tramo_costas);
    h += fila('Temporalidad', p.temporalidad);
    h += fila('Adjudicado', p.lote_adjudicado);
    h += '</table></div>';
  }
  return h+'</div>';
}

const lista = document.getElementById('lista');
const q = document.getElementById('q');
const fplaya = document.getElementById('fplaya');
const fexp = document.getElementById('fexp');
const f100 = document.getElementById('f100');
const idx = {};
capa.eachLayer(l=>{ idx[l.feature.properties.codigo] = l; });

[...new Set(DATOS.features.map(f=>f.properties.playa))].sort()
  .forEach(v=>fplaya.add(new Option(v,v)));
[...new Set(DATOS.features.map(f=>f.properties.expediente))].sort()
  .forEach(v=>fexp.add(new Option(v,v)));

let sel = null;
function marca(cod){
  sel = cod;
  [...lista.children].forEach(e=>e.classList.toggle('sel', e.dataset.cod===cod));
  const e = lista.querySelector('.it.sel');
  if(e) e.scrollIntoView({block:'nearest'});
}
function visibles(){
  const t = q.value.trim().toLowerCase();
  return DATOS.features.filter(f=>{
    const p = f.properties;
    if(f100.checked && !p.licita_100) return false;
    if(fplaya.value && p.playa!==fplaya.value) return false;
    if(fexp.value && p.expediente!==fexp.value) return false;
    if(t && !(p.codigo+' '+p.playa+' '+p.expediente+' '+(p.lote?'lote '+p.lote:'')).toLowerCase().includes(t)) return false;
    return true;
  });
}
function pinta(){
  const v = visibles();
  const cods = new Set(v.map(f=>f.properties.codigo));
  capa.eachLayer(l=>{
    const on = cods.has(l.feature.properties.codigo);
    l.setStyle(on?estilo(l.feature):{opacity:.12,fillOpacity:.04,weight:1});
  });
  const n100 = v.filter(f=>f.properties.licita_100).length;
  document.getElementById('cuenta').innerHTML =
    `<b>${v.length}</b> parcelas · <b>${n100}</b> del expediente PAT 255/25 · ` +
    `<b>${v.reduce((a,f)=>a+f.properties.superficie,0).toLocaleString('es-ES')}</b> m² autorizados`;
  const tt = document.getElementById('tiraTx');
  if(tt) tt.textContent = v.length + (v.length===1?' parcela':' parcelas') +
      (n100 ? ' · ' + n100 + ' del PAT 255/25' : '');
  lista.innerHTML = '';
  v.sort((a,b)=> a.properties.playa.localeCompare(b.properties.playa) ||
                 a.properties.superficie-b.properties.superficie)
   .forEach(f=>{
    const p = f.properties;
    const d = document.createElement('div');
    d.className = 'it'+(p.codigo===sel?' sel':'');
    d.dataset.cod = p.codigo;
    d.innerHTML = `<div><div class="cod">${p.codigo}</div>
      <div class="sub">${p.playa} · ${p.superficie} m² · ${p.expediente}</div></div>
      ${p.lote?`<span class="tag l100">Lote ${p.lote}</span>`:`<span class="tag">${p.superficie} m²</span>`}`;
    d.onclick = ()=>{
      const l = idx[p.codigo];
      map.fitBounds(l.getBounds().pad(6));
      l.openPopup(); marca(p.codigo);
    };
    lista.appendChild(d);
  });
}
[q,fplaya,fexp,f100].forEach(e=>e.addEventListener('input',pinta));
pinta();

/* --- modo telefono: panel inferior desplegable --- */
const side = document.getElementById('side');
const tira = document.getElementById('tira');
function modo(){
  const m = window.innerWidth <= 820;
  const cambio = document.body.classList.contains('movil') !== m;
  document.body.classList.toggle('movil', m);
  if(m && !side.dataset.init){ side.classList.add('plegado'); side.dataset.init = '1'; }
  setTimeout(()=>{ map.invalidateSize(); if(cambio) encuadra(); }, 240);
}
function encuadra(){ map.fitBounds(capa.getBounds(), {padding:[22,22]}); }
function plegar(v){
  side.classList.toggle('plegado', v);
  document.getElementById('tiraIc').textContent = v ? '▲' : '▼';
  setTimeout(()=>map.invalidateSize(), 230);
}
tira.addEventListener('click', ()=>plegar(!side.classList.contains('plegado')));
window.addEventListener('resize', modo);
modo();
/* encuadre inicial una vez fijado el tamano real del contenedor */
requestAnimationFrame(()=>{ map.invalidateSize(); encuadra();
  setTimeout(()=>{ map.invalidateSize(); encuadra(); }, 320); });
/* al elegir una parcela en el movil, se pliega para dejar ver el mapa */
lista.addEventListener('click', ()=>{ if(document.body.classList.contains('movil')) plegar(true); });

L.control.attribution({prefix:false});
const leg = L.control({position:'bottomright'});
leg.onAdd = function(){
  const d = L.DomUtil.create('div','leyenda');
  d.innerHTML = `<i style="background:rgba(244,76,58,.55);border-color:#f44c3a"></i>Lotes de ≤100 m² · PAT 255/25<br>
                 <i style="background:rgba(55,160,180,.35);border-color:#37a0b4"></i>Resto de parcelas del municipio`;
  return d;
};
leg.addTo(map);
document.getElementById('pie').innerHTML = "Geometría extraída de los PDF georreferenciados del Anexo II del expediente (EPSG:25830, 44 planos firmados el 11/08/2025). Códigos verificados uno a uno sobre los planos. Contraste con el Anexo I para los 16 lotes de ≤100 m²: desviación media de 1,1 m y máxima de 2,9 m. Superficie medida frente a la autorizada: 98 % de las parcelas dentro del ±3 %. Datos de expediente, estado e importe: Plataforma de Contratación del Sector Público, 21/09/2026. AMMA Consulting.";
